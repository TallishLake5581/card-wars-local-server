name: Build Flutter APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract and Organize Project
        run: |
          echo "Looking for ZIP files..."
          ls -la
          # فك ضغط أي ملف zip موجود في المستودع
          unzip -q "*.zip" -d extracted_source || true
          
          # البحث عن مكان وجود ملف pubspec.yaml ونقل محتواه للمجلد الرئيسي
          if [ -d "extracted_source" ]; then
            cd extracted_source
            PROJECT_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            if [ -n "$PROJECT_DIR" ]; then
              echo "Found project at: $PROJECT_DIR"
              cd "$PROJECT_DIR"
              cp -r . ../../
              cd ../../
            fi
            cd ..
          fi
          
          echo "Checking project structure..."
          ls -la

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: card-wars-apk
          path: build/app/outputs/flutter-apk/app-release.apk
